name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `bun run` lance Vite, svelte-check et Vitest sous Node : SvelteKit 3 exige ≥ 22.17,
      # on ne dépend donc pas de la version préinstallée sur le runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
