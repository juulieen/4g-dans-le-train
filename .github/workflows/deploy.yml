name: Deploy

# Déploiement sur le serveur perso via un runner self-hosted (modèle ttt-chrono).
# `clean: false` est CRITIQUE : évite que git clean -ffdx n'efface ./data
# (le fichier libSQL gitignoré monté dans le conteneur).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Build & up
        # --pull : récupère la dernière image de base (oven/bun:1…) au lieu
        # de réutiliser celle en cache sur le runner (correctifs de sécurité).
        run: |
          docker compose build --pull
          docker compose up -d
      - name: Migrate
        run: docker compose exec -T 4g-dans-le-train bun run scripts/migrate.ts
